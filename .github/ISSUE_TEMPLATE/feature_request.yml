name: Feature request
description: Suggest a change to the editor flow, setup, or a backend.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: The app stays editor-initiated and draft-only. It does not translate automatically or publish.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What editors or administrators cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
